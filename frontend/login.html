<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Cafe | Secure Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body { background-color: var(--bg-light); display: flex; justify-content: center; align-items: center; height: 100vh; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; }
        .login-box { background: var(--white); padding: 40px; border-radius: 16px; box-shadow: var(--shadow); width: 100%; max-width: 400px; text-align: center; }
        .input-group { margin-bottom: 20px; }
        .login-input { width: 100%; padding: 14px 16px; border: 1px solid var(--border-color); border-radius: 10px; font-size: 1rem; transition: var(--transition); box-sizing: border-box; }
        .login-input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1); }
    </style>
</head>
<body>
    <div class="login-box">
        <i class="fa-solid fa-lock" style="font-size: 3rem; color: var(--primary); margin-bottom: 20px;"></i>
        <h2 style="margin-bottom: 8px; color: var(--text-dark);">Staff Portal</h2>
        <p style="color: var(--text-muted); margin-bottom: 24px; font-size: 0.95rem;">Enter your credentials to access the dashboard</p>
        
        <div id="error-msg" style="color: #EF4444; background: #FEE2E2; padding: 10px; border-radius: 8px; margin-bottom: 20px; display: none; font-size: 0.9rem; font-weight: 500;"></div>
        
        <div class="input-group" style="text-align: left;">
            <input type="text" id="username" class="login-input" placeholder="Username (e.g. admin)">
        </div>
        <div class="input-group" style="text-align: left;">
            <input type="password" id="password" class="login-input" placeholder="Password">
        </div>
        
        <button class="btn btn-primary" style="width: 100%; padding: 14px; border-radius: 10px; font-size: 1.1rem; margin-top: 10px; font-weight: 600;" onclick="authenticate()">Sign In</button>
        <p style="margin-top: 24px; color: var(--text-muted); font-size: 0.9rem;"><a href="index.html" style="color: var(--text-dark); text-decoration: none; font-weight: 500;"><i class="fa-solid fa-arrow-left" style="margin-right: 6px;"></i> Return to Cafe Setup</a></p>
    </div>

    <script>
        async function authenticate() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const errMsg = document.getElementById('error-msg');
            
            if(!user || !pass) { 
                errMsg.innerText = "Please enter both username and password."; 
                errMsg.style.display = 'block'; 
                return; 
            }

            try {
                const pyUrl = window.location.protocol === 'file:' ? 'http://localhost:3000/api/auth/login' : '/api/auth/login';
                const res = await fetch(pyUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: user, password: pass })
                });
                
                const data = await res.json();
                
                if (res.ok && data.success) {
                    sessionStorage.setItem('adminToken', data.token);
                    const redirectTo = sessionStorage.getItem('redirectAfterLogin') || 'admin.html';
                    sessionStorage.removeItem('redirectAfterLogin');
                    window.location.href = redirectTo;
                } else {
                    errMsg.innerText = data.message || "Invalid credentials provided.";
                    errMsg.style.display = 'block';
                }
            } catch(e) {
                errMsg.innerText = "Server connection error. Ensure local backend is running.";
                errMsg.style.display = 'block';
            }
        }
        
        // Allow enter key submission
        document.getElementById('password').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') authenticate();
        });
    </script>
</body>
</html>
