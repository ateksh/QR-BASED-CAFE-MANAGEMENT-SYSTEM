<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Modern Cafe | Menu</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        
        <header class="header">
            <button class="nav-back d-flex" style="position: static; width: 40px; height: 40px; border: none;" onclick="history.back()">
                <i class="fa-solid fa-chevron-left"></i>
            </button>
            <h1 style="font-size: 1.25rem; font-weight: 600;">Full Menu</h1>
            <button class="nav-action d-flex" style="position: static; width: 40px; height: 40px; border: none; background: transparent; box-shadow: none;">
                <i class="fa-solid fa-magnifying-glass text-dark"></i>
            </button>
        </header>

        <div class="category-tabs" id="menu-tabs">
            
        </div>

        <div class="section-header mt-3">
            <h2 class="section-title" id="current-category">Hot Coffee</h2>
        </div>

        <div class="products-grid" id="menu-products">
            
        </div>

    </div>

    <script src="js/main.js"></script>
    <script>
        let currentCategory = localStorage.getItem('selectedCategory') || 'Hot Coffee';
        document.addEventListener('DOMContentLoaded', () => {
            renderBottomNav('menu');
            renderTabs();
            renderProducts(currentCategory);
        });

        function renderTabs() {
            const tabsContainer = document.getElementById('menu-tabs');
            tabsContainer.innerHTML = categories.map(cat => `
                <button class="tab-btn ${cat === currentCategory ? 'active' : ''}" 
                        onclick="switchCategory('${cat}')">
                    ${cat}
                </button>
            `).join('');

            setTimeout(() => {
                const activeTab = document.querySelector('.tab-btn.active');
                if(activeTab) activeTab.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
            }, 100);
        }

        function switchCategory(cat) {
            currentCategory = cat;
            localStorage.setItem('selectedCategory', cat);
            renderTabs();
            renderProducts(cat);
        }

        function renderProducts(cat) {
            const TitleEl = document.getElementById('current-category');
            TitleEl.innerText = cat;
            const container = document.getElementById('menu-products');
            const filtered = products.filter(p => p.category === cat);
            container.innerHTML = filtered.map(p => createProductCardHTML(p)).join('');

            container.style.opacity = '0';
            setTimeout(() => {
                container.style.transition = 'opacity 0.3s ease';
                container.style.opacity = '1';
            }, 10);
        }</script>
</body>
</html>
