<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Modern Cafe | Profile</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="css/style.css">
    <style>
        .profile-header-card {
            background: linear-gradient(135deg, var(--primary) 0%, #4A3324 100%);
            border-bottom-left-radius: 40px;
            border-bottom-right-radius: 40px;
            padding: 50px 24px 40px;
            color: var(--white);
            text-align: center;
            position: relative;
        }

        .profile-avatar-wrapper {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 4px solid rgba(255,255,255,0.2);
            margin: 0 auto 16px;
            position: relative;
        }

        .profile-avatar-wrapper img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        .edit-avatar-btn {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 32px;
            height: 32px;
            background-color: var(--accent);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--white);
            border: 2px solid var(--primary);
            cursor: pointer;
        }

        .profile-menu-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: var(--white);
            padding: 16px 20px;
            border-radius: 16px;
            margin-bottom: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.02);
            cursor: pointer;
            transition: var(--transition);
        }

        .profile-menu-item:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow);
        }

        .menu-item-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .menu-item-icon {
            width: 40px;
            height: 40px;
            background-color: var(--secondary);
            color: var(--primary);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
        }

        .menu-item-text h4 {
            font-size: 1rem;
            margin-bottom: 2px;
        }

        .menu-item-text p {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .logout-btn {
            background-color: #FEF2F2;
            color: #DC2626;
            margin-top: 24px;
        }

        .logout-btn .menu-item-icon {
            background-color: #FEE2E2;
            color: #DC2626;
        }</style>
</head>
<body>
    <div class="app-container">

        <div class="profile-header-card">
            <button class="nav-back d-flex" style="position: absolute; top: 20px; left: 20px; width: 40px; height: 40px; border: none; background: rgba(255,255,255,0.2); color: white;" onclick="history.back()">
                <i class="fa-solid fa-chevron-left"></i>
            </button>
            <div class="profile-avatar-wrapper">
                <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?q=80&w=250&auto=format&fit=crop" alt="Profile avatar">
                <div class="edit-avatar-btn">
                    <i class="fa-solid fa-camera" style="font-size: 0.8rem;"></i>
                </div>
            </div>
            <h1 style="font-size: 1.4rem; margin-bottom: 4px;">James Anderson</h1>
            <p style="opacity: 0.8; font-size: 0.9rem;">james.anderson@example.com</p>
            <div style="display: flex; justify-content: center; gap: 24px; margin-top: 20px; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.1);">
                <div>
                    <h3 style="color: var(--white); font-size: 1.2rem;">12</h3>
                    <p style="font-size: 0.75rem; opacity: 0.8;">Orders</p>
                </div>
                <div style="width: 1px; background-color: rgba(255,255,255,0.2);"></div>
                <div>
                    <h3 style="color: var(--accent); font-size: 1.2rem;">1,250</h3>
                    <p style="font-size: 0.75rem; opacity: 0.8;">Points</p>
                </div>
            </div>
        </div>

        <div style="padding: 24px;">
            <h3 style="font-size: 1.1rem; margin-bottom: 16px; color: var(--text-dark);">General</h3>
            
            <div class="profile-menu-item">
                <div class="menu-item-left">
                    <div class="menu-item-icon"><i class="fa-regular fa-user"></i></div>
                    <div class="menu-item-text">
                        <h4>Personal Details</h4>
                        <p>Name, email, phone number</p>
                    </div>
                </div>
                <i class="fa-solid fa-chevron-right" style="color: var(--text-muted); font-size: 0.9rem;"></i>
            </div>

            <div class="profile-menu-item">
                <div class="menu-item-left">
                    <div class="menu-item-icon"><i class="fa-solid fa-location-dot"></i></div>
                    <div class="menu-item-text">
                        <h4>Delivery Addresses</h4>
                        <p>Manage your saved addresses</p>
                    </div>
                </div>
                <i class="fa-solid fa-chevron-right" style="color: var(--text-muted); font-size: 0.9rem;"></i>
            </div>

            <div class="profile-menu-item">
                <div class="menu-item-left">
                    <div class="menu-item-icon"><i class="fa-regular fa-credit-card"></i></div>
                    <div class="menu-item-text">
                        <h4>Payment Methods</h4>
                        <p>Linked cards and balances</p>
                    </div>
                </div>
                <i class="fa-solid fa-chevron-right" style="color: var(--text-muted); font-size: 0.9rem;"></i>
            </div>

            <h3 style="font-size: 1.1rem; margin-top: 24px; margin-bottom: 16px; color: var(--text-dark);">Other</h3>

            <div class="profile-menu-item">
                <div class="menu-item-left">
                    <div class="menu-item-icon"><i class="fa-solid fa-clock-rotate-left"></i></div>
                    <div class="menu-item-text">
                        <h4>Order History</h4>
                        <p>View your past purchases</p>
                    </div>
                </div>
                <i class="fa-solid fa-chevron-right" style="color: var(--text-muted); font-size: 0.9rem;"></i>
            </div>
            
            <div class="profile-menu-item logout-btn" onclick="showToast('Logged out securely')">
                <div class="menu-item-left">
                    <div class="menu-item-icon"><i class="fa-solid fa-arrow-right-from-bracket"></i></div>
                    <div class="menu-item-text">
                        <h4 style="color: #DC2626;">Logout</h4>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script src="js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            renderBottomNav('profile');
        });</script>
</body>
</html>
